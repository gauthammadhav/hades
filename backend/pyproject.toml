[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hades"
version = "0.1.0"
description = "HADES (Hardware-Aware Development Sandbox) - Discovery & Orchestration"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyudev>=0.24.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
hades = "hades.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["hades*"]

